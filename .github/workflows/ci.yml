name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev dependencies
        run: pip install ".[dev]"
      - name: Lint with ruff
        run: ruff check src tests
      - name: Type-check with mypy
        run: mypy src tests
      - name: Run unit tests
        run: pytest -v
      - name: Run deterministic benchmark suite
        run: spatialgrid benchmark
